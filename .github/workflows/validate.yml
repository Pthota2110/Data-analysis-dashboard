name: Validate Analytics Scripts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Run Python Analysis Scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sales analysis (KPIs + charts)
        run: python scripts/sales_analysis.py

      - name: Run insight generator
        run: python scripts/generate_insights.py

      - name: Upload chart artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-charts
          path: output/
          retention-days: 30
